# FaltaUno - API y servicios locales de desarrollo
# Levantar todo:            docker compose up -d --build
# Recarga en caliente:      docker compose watch        (deja la API sincronizada con api/src)
# Producción / demo:        docker compose -f docker-compose.yml -f docker-compose.produccion.yml up -d --build
# Detener:                  docker compose down          (los datos se conservan en los volúmenes)
# Borrar todo, incluidos los datos:  docker compose down -v
#
# Base de datos de la API (variable BASE_DATOS, en un archivo .env en esta carpeta o en la terminal):
#   supabase (por defecto): usa POSTGRES_URL de api/.env
#   local:                  usa el servicio "postgres" de este archivo

# Nombre del proyecto: separa estos contenedores y volúmenes de otras copias (por ejemplo, la demo)
name: faltauno-dev

services:
  postgres:
    image: postgres:17
    container_name: faltauno-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: faltauno
      POSTGRES_USER: faltauno
      POSTGRES_PASSWORD: faltauno_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Con el volumen vacío, aplica las migraciones y los datos de prueba (db/docker-init)
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
      - ./db:/faltauno-db:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U faltauno -d faltauno']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:8
    container_name: faltauno-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: faltauno
      MONGO_INITDB_ROOT_PASSWORD: faltauno_dev
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: faltauno-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # Correos de desarrollo: todo lo que envía la API se ve en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: faltauno-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # Visor de la base: http://localhost:5050 (contraseña de la base: faltauno_dev)
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: faltauno-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@faltauno.uy
      PGADMIN_DEFAULT_PASSWORD: faltauno_dev
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - '5050:80'
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.3 # versión fija: todo el equipo usa la misma
    container_name: faltauno-n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: America/Montevideo
      TZ: America/Montevideo
    ports:
      - '5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
      # Flujos exportados en JSON (npm run n8n:exportar / n8n:importar), versionados en Git
      - ./n8n:/home/node/flujos

  # API REST (api/Dockerfile). Lee api/.env; acá solo se cambian las direcciones que dentro de Docker
  # no son "localhost" sino el nombre del servicio.
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: desarrollo
    image: faltauno-api:desarrollo
    container_name: faltauno-api
    restart: unless-stopped
    env_file: api/.env
    environment:
      BASE_DATOS: ${BASE_DATOS:-supabase}
      POSTGRES_URL_LOCAL: postgres://faltauno:faltauno_dev@postgres:5432/faltauno
      MONGO_URL: mongodb://faltauno:faltauno_dev@mongo:27017/?authSource=admin
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PUERTO: '1025'
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/pronostico
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    # docker compose watch: copia los cambios de api/src al contenedor (tsx recarga solo)
    # y reconstruye la imagen si cambian las dependencias.
    develop:
      watch:
        - action: sync
          path: ./api/src
          target: /app/api/src
        - action: rebuild
          path: ./api/package-lock.json

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  n8n_data:
  pgadmin_data:
